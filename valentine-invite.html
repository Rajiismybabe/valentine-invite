<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Valentine's Day!</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      text-align: center;
      background: pink;
      color: white;
      padding-top: 100px;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 50px;
    }

    button {
      background: red;
      color: white;
      border: none;
      padding: 20px 40px;
      font-size: 1.5em;
      border-radius: 15px;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    button:hover {
      background: darkred;
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <h1> Valentine's Day is almost here Boob ❤️</h1>
  <button onclick="alert('Will you be my Valentine? 💌')">Click Me 💖</button>
</body>
</html>
